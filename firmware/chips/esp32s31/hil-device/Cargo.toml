[package]
name = "firmware-esp32s31-hil-device"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "firmware-provisioning-hil"
path = "../../../hil/provisioning/device/src/main.rs"

[dependencies]
critical-section = "1.2.0"
edge-dhcp = "0.7.0"
edge-nal = "0.6.0"
edge-nal-embassy = "0.8.1"
embassy-executor = "0.10.0"
embassy-futures = "0.1.2"
embassy-net = { version = "0.8.0", features = ["dhcpv4", "medium-ethernet", "tcp", "udp"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.0"
embedded-io-async = "0.7.0"
esp-alloc = "0.11.0"
heapless = "0.8.0"
log = { version = "=0.4.27", default-features = false }
portable-atomic = { version = "=1.14.0", default-features = false }
static_cell = "2.1.0"

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s31"] }
esp-hal = { version = "=1.2.2", features = ["esp32s31", "unstable"] }
esp-metadata-generated = { version = "=0.5.3", features = ["esp32s31"] }
esp-println = { version = "0.18.0", default-features = false, features = ["esp32s31", "auto", "log-04"] }
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32s31", "wifi"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp-radio", "esp32s31", "log-04"] }
esp-storage = { version = "0.10.0", features = ["esp32s31", "embedded-storage"] }
wifi-provisioning = { path = "../../../services/provisioning", features = ["hil"] }
hil-testing = { path = "../../../hil/support" }
